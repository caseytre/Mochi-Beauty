<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mochi's Room</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Parisienne&family=Pixelify+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
/* coquette: blush, cream, ribbon rose, cherry, soft wine outlines */
:root{
  --bg:#FFFDFC; --fg:#4A2E24; --muted:#9A7665; --card:#FFFFFF;
  --line:#4A2E24; --shadow:#E7BBA3; --wall:#4A2E24;
  --accent:#E89765; --stage:#FFFFFF; --gingham:rgba(246,193,166,.30); --chip:#FFE9DD;
  --living:#F9E5D8; --kitchen:#FFF3E0; --bath:#DCEAF8; --vanity:#F6D8C6; --bed:#F3DDDC; --office:#EFE8E1; --closet:#F6E4DE;
  --room:#F9E5D8;
  color-scheme:light;
}
[data-room="living"]{--room:var(--living)}
[data-room="closet"]{--room:var(--closet)}
[data-room="kitchen"]{--room:var(--kitchen)}
[data-room="bath"]{--room:var(--bath)}
[data-room="vanity"]{--room:var(--vanity)}
[data-room="bed"]{--room:var(--bed)}
[data-room="office"]{--room:var(--office)}

*{box-sizing:border-box}
body{margin:0;background-color:var(--bg);background-attachment:fixed;background-size:192px 192px;color:var(--fg);font:400 16px/1.55 'DM Sans',system-ui,sans-serif;padding-inline:16px;padding-block:20px 48px}
.wrap{max-width:880px;margin-inline:auto;display:flex;flex-direction:column;gap:30px}
h1,h2,.px{font-family:'Pixelify Sans','Courier New',monospace;font-weight:600;margin:0;text-wrap:balance}
h1{font-size:clamp(2rem,6vw,3rem);line-height:1.05;text-shadow:3px 3px 0 #F9D5C1;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
h2{font-size:1.2rem;line-height:1.2}
p{margin:0}
a{color:inherit}
a:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.sub{font-family:'Parisienne','Snell Roundhand',cursive;font-size:1.55rem;line-height:1.25;color:var(--accent);margin-top:6px;max-width:34ch}
.mast{display:flex;flex-direction:column}

.stage{position:relative;max-width:960px;width:100%;margin-inline:auto;background:var(--stage);padding:10px;box-shadow:0 0 0 2px var(--line),0 0 0 8px #FFE3D3,0 0 0 10px var(--line),8px 8px 0 10px var(--shadow)}
.scene{position:relative;line-height:0}
.scene svg{display:block;width:100%;height:auto}
.scene .w{fill:var(--wall)}
.plq{font-family:'Pixelify Sans',monospace;font-size:9px;fill:#4A2E24}
.item{cursor:pointer;transition:transform .12s steps(2);transform-box:fill-box}
.item:hover,.item:focus-visible{transform:translateY(-2px);filter:brightness(1.08)}
.item:focus-visible{outline:none}
.mochi{position:absolute;width:10.714%;cursor:pointer;transition:left .85s cubic-bezier(.4,0,.2,1),top .85s cubic-bezier(.4,0,.2,1)}
.mw{position:relative;animation:bob 2.4s steps(1) infinite}
.mw img{display:block;width:100%;height:auto;image-rendering:pixelated}
.acc{position:absolute;left:0;top:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.mochi.hop .mw,.heromochi.hop .mw{animation:hop .85s ease-out}
.mochi:focus-visible,.heromochi:focus-visible{outline:3px solid var(--accent);outline-offset:4px}
.heromochi{cursor:pointer;width:135px;padding-top:30px}
.cloud{animation:drift linear infinite}
@keyframes drift{from{transform:translateX(0)}to{transform:translateX(var(--d))}}
.bulb{animation:twinkle 2.4s steps(1) infinite}
.b1{animation-delay:-.8s}.b2{animation-delay:-1.6s}
@keyframes twinkle{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-2.5%)}}
@keyframes hop{0%{transform:translateY(0)}40%{transform:translateY(-28%)}100%{transform:translateY(0)}}

.bubble{max-width:960px;width:100%;margin-inline:auto;background:var(--card);padding:12px 14px;box-shadow:0 0 0 2px var(--line),4px 4px 0 var(--shadow);display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:start;min-height:5.2rem}
.who{grid-column:1/-1;font-family:'Pixelify Sans',monospace;font-size:.8rem;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.bubble p{min-width:0;font-size:1.05rem;min-height:3.1em}
.snd{font:inherit;font-family:'Pixelify Sans',monospace;font-size:.85rem;background:transparent;color:var(--muted);border:2px solid var(--line);padding:2px 8px;cursor:pointer;align-self:end}
.snd[aria-pressed="true"]{background:var(--chip);color:var(--fg)}

.disclosure{max-width:960px;width:100%;margin-inline:auto;font-size:.9rem;color:var(--muted)}
.rooms{max-width:960px;width:100%;margin-inline:auto;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.rbtn{display:block;text-align:center;text-decoration:none;font-family:'Pixelify Sans',monospace;font-weight:600;font-size:1.1rem;padding:12px 8px;background:var(--room);color:var(--fg);box-shadow:0 0 0 2px var(--line),4px 4px 0 var(--shadow);transition:transform .1s steps(2),box-shadow .1s steps(2)}
.rbtn:hover{transform:translate(2px,2px);box-shadow:0 0 0 2px var(--line),2px 2px 0 var(--shadow)}
.rbtn[aria-current="page"]{transform:translate(4px,4px);box-shadow:0 0 0 2px var(--line);}
.foot{max-width:960px;width:100%;margin-inline:auto;font-size:.8rem;color:var(--muted)}

/* room pages */
.back{align-self:flex-start;font-family:'Pixelify Sans',monospace;font-size:1rem;text-decoration:none;padding:4px 10px;background:var(--card);box-shadow:0 0 0 2px var(--line),3px 3px 0 var(--shadow)}
.back:hover{transform:translate(1px,1px)}
.hero{max-width:960px;width:100%;margin-inline:auto;background:var(--room);padding:20px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:end;box-shadow:0 0 0 2px var(--line),6px 6px 0 var(--shadow)}
.hero .say{margin-top:12px;background:var(--card);padding:10px 12px;box-shadow:0 0 0 2px var(--line);min-height:3.4em;max-width:40ch}

.grid{max-width:960px;width:100%;margin:0 auto;padding:0;list-style:none;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:20px}
.card{min-width:0;background:var(--card);padding:16px;display:flex;flex-direction:column;gap:10px;box-shadow:0 0 0 2px var(--line),4px 4px 0 var(--shadow)}
.card:target{outline:3px dashed var(--accent);outline-offset:6px}
.tile{width:84px;height:84px;background:var(--room);display:grid;place-items:center;box-shadow:0 0 0 2px var(--line)}
.tile svg{width:66px;height:66px;display:block;shape-rendering:crispEdges}
.card p{color:var(--muted);font-size:.95rem}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-family:'Pixelify Sans',monospace;font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;background:var(--chip);padding:1px 8px;box-shadow:0 0 0 2px var(--line)}
.buy{margin-top:auto;align-self:flex-start;font-family:'Pixelify Sans',monospace;font-weight:600;text-decoration:none;padding:8px 12px;background:var(--accent);color:#4A2E24;box-shadow:0 0 0 2px var(--line),3px 3px 0 var(--shadow)}
.buy:hover{transform:translate(1px,1px)}

@media (max-width:620px){
  .rooms{grid-template-columns:repeat(2,minmax(0,1fr))}
  .hero{grid-template-columns:minmax(0,1fr);}
  .heromochi{width:108px;order:-1}
  .stage{padding:6px}
}
@media (prefers-reduced-motion:reduce){
  .mochi,.mw,.cloud,.bulb,.item,.rbtn{transition:none!important;animation:none!important}
}

.roomlink{cursor:pointer}
.roomlink:hover,.roomlink:focus-visible{filter:brightness(1.06)}
.roomlink:focus-visible{outline:none}
.room-stage{max-width:540px;margin-inline:auto}
.room-stage svg{display:block;width:100%;height:auto}
.filter{max-width:960px;width:100%;margin-inline:auto;display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.filter label{font-family:'Pixelify Sans',monospace;font-weight:600}
.filter select{font:inherit;min-width:0;max-width:100%;padding:8px 12px;background:var(--card);color:var(--fg);border:0;border-radius:0;box-shadow:0 0 0 2px var(--line),3px 3px 0 var(--shadow)}
.count{color:var(--muted);font-size:.9rem}

#iris{position:fixed;inset:0;z-index:9999;pointer-events:all;background:#4A2E24}
#iris.off{display:none}
.intro .rooms,.intro .disclosure,.intro .foot{display:none}
.bubble.clickable{cursor:pointer}
.bubble.clickable:hover{transform:translate(1px,1px)}
.next{display:inline-block;color:var(--accent);animation:blink 1s steps(2) infinite}
.hint{grid-column:1/-1;font-family:'Pixelify Sans',monospace;font-size:.9rem;color:var(--accent);letter-spacing:.06em;animation:blink 1.2s steps(2) infinite}
@keyframes blink{50%{opacity:.25}}
.door{cursor:pointer}
.door:focus-visible{outline:none}
.door:focus-visible .doorglow,.door:hover .doorglow{opacity:1}
.doorglow{opacity:0}
.arrow{opacity:0}
.door.pulse .arrow{opacity:1;animation:arrowbob .9s steps(2) infinite}
.door.pulse .doorglow{opacity:1;animation:blink 1.1s steps(2) infinite}
@keyframes arrowbob{50%{transform:translateY(4px)}}
.smoke{animation:rise 4s steps(8) infinite;transform-box:fill-box}
@keyframes rise{from{transform:translate(0,0);opacity:.9}to{transform:translate(10px,-30px);opacity:0}}
.toprow{max-width:960px;width:100%;margin-inline:auto;display:flex;justify-content:space-between;align-items:center;gap:12px}
@media (prefers-reduced-motion:reduce){.next,.hint,.smoke,.door.pulse .arrow,.door.pulse .doorglow{animation:none!important}}
.next[hidden],.hint[hidden]{display:none!important}

.card{position:relative}
.bubble{box-shadow:0 0 0 2px var(--line),0 0 0 6px #FFE3D3,0 0 0 8px var(--line)}
.who::before{content:"\2661 "}
#iris,#iris.off{background:#3A231B}
#iris.off{display:none}

.mast{align-items:center;text-align:center;padding-top:6px}
.mast h1{justify-content:center;font-weight:400;font-size:clamp(2.4rem,8vw,4rem);letter-spacing:.02em;text-shadow:2px 2px 0 #F9D5C1}
.hero h1{font-weight:400}


.bgf{position:fixed;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none}
.pbow{display:block;width:52px;height:24px}
.pheart{display:inline-block;width:18px;height:16px;margin-right:8px;vertical-align:-2px}
.tb{display:inline-flex}.tb.l{transform:none}
.cb{position:absolute;top:-17px;z-index:2;line-height:0}
.cb.l{left:-14px;transform:rotate(-14deg)}.cb.r{right:-14px;transform:rotate(14deg)}
.cardbow{position:absolute;top:-12px;right:10px;width:38px;line-height:0}
.cardbow .pbow{width:38px;height:18px}
/* compact room pages */
body[data-room] .wrap{gap:20px}
body[data-room] .hero{padding:12px 16px;gap:12px;align-items:center;max-width:960px}
body[data-room] .hero h1{font-size:1.7rem;line-height:1.1}
body[data-room] .hero p{font-size:.85rem;margin:2px 0 0}
body[data-room] .hero .say{max-width:60ch;margin-top:8px;padding:6px 10px;min-height:2.6em;font-size:.85rem}
body[data-room] .heromochi{width:80px;padding-top:18px}
body[data-room] .rooms{max-width:960px;gap:8px;grid-template-columns:repeat(6,minmax(0,1fr))}
body[data-room] .rbtn{font-size:.85rem;padding:7px 6px;box-shadow:0 0 0 2px var(--line),3px 3px 0 var(--shadow)}
body[data-room] .pheart{width:13px;height:12px;margin-right:5px;vertical-align:-1px}
@media (max-width:620px){
  body[data-room] .hero{grid-template-columns:minmax(0,1fr) auto}
  body[data-room] .heromochi{width:70px;order:0}
  body[data-room] .rooms{grid-template-columns:repeat(3,minmax(0,1fr))}
  body[data-room] .rbtn{font-size:.75rem;padding:6px 2px}
  body[data-room] .pheart{display:none}
}

.tile img{width:100%;height:100%;object-fit:contain;display:block}
.rooms{grid-template-columns:repeat(4,minmax(0,1fr))}
body[data-room] .rooms{grid-template-columns:repeat(7,minmax(0,1fr))}
@media (max-width:620px){
  .rooms{grid-template-columns:repeat(2,minmax(0,1fr))}
  body[data-room] .rooms{grid-template-columns:repeat(4,minmax(0,1fr))}
}
body[data-room] .rbtn{white-space:nowrap;font-size:.8rem;padding:7px 2px}
@media (max-width:620px){body[data-room] .rbtn{font-size:.68rem}}

.fall{transform-box:fill-box;animation:fallleaf 12s linear infinite;opacity:.95}
@keyframes fallleaf{0%{transform:translate(0,-12px) rotate(0deg)}50%{transform:translate(calc(var(--sx,24px)*.5),150px) rotate(140deg)}100%{transform:translate(var(--sx,24px),312px) rotate(300deg)}}
@media (prefers-reduced-motion:reduce){.fall{animation:none!important;display:none}}

</style></head>

const ICON_COLORS = { o: "#4A2E24", b: "#FCECD6", c: "#FCECD6", y: "#E8B943", g: "#7EBB60", h: "#639A4B" };

function iconSVG(name, accent) {
  const g = ICONS[name] || ICONS.candle;
  let r = "";
  g.forEach((row, y) => {
    for (let x = 0; x < 11; x++) {
      const c = row[x];
      if (!c || c === ".") continue;
      const f = c === "a" ? accent : ICON_COLORS[c];
      if (f) r += `<rect x="${x}" y="${y}" width="1" height="1" fill="${f}"/>`;
    }
  });
  return `<svg viewBox="0 0 11 11" aria-hidden="true" shape-rendering="crispEdges">${r}</svg>`;
}

};

const Snd = (() => {
  let ctx = null, on = store.get("mochi-snd") === "1", wantMusic = false;
  const api = {};

  };

    const c = api.ctx(); if (!c) return;

  };
  ["pointerdown", "keydown"].forEach(ev => window.addEventListener(ev, api.unlock, { capture: true }));
  const running = () => { const c = api.ctx(); return c && c.state === "running" ? c : null; };

  // animalese: a short, soft pitched blip per letter
  api.blip = ch => {
    const c = running(); if (!on || !c || !ch || !/[a-z0-9]/i.test(ch)) return;
    const idx = ch.toLowerCase().charCodeAt(0) % 26, scale = [0, 2, 4, 7, 9];
    const note = scale[idx % 5] + 12 * (Math.floor(idx / 5) % 2);
    const f = 300 * Math.pow(2, note / 12) * (0.98 + Math.random() * 0.04);
    const t = c.currentTime, o = c.createOscillator(), lp = c.createBiquadFilter(), g = c.createGain();
    o.type = "triangle"; o.frequency.setValueAtTime(f * 1.06, t); o.frequency.exponentialRampToValueAtTime(f, t + 0.04);
    lp.type = "lowpass"; lp.frequency.value = 2400;
    g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(0.07, t + 0.006); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.07);
    o.connect(lp); lp.connect(g); g.connect(c.destination); o.start(t); o.stop(t + 0.09);
  };

  // a cat-ish "mee-ow": gliding sawtooth through two moving vowel formants
  api.meow = () => {
    const c = running(); if (!on || !c) return;
    const t = c.currentTime, p = 0.94 + Math.random() * 0.14, d = 0.7;
    const o = c.createOscillator(), vib = c.createOscillator(), vg = c.createGain();
    o.type = "sawtooth";
    o.frequency.setValueAtTime(480 * p, t);
    o.frequency.linearRampToValueAtTime(700 * p, t + 0.1);
    o.frequency.linearRampToValueAtTime(980 * p, t + 0.26);
    o.frequency.linearRampToValueAtTime(760 * p, t + 0.46);
    o.frequency.linearRampToValueAtTime(430 * p, t + d);
    vib.frequency.value = 6.5; vg.gain.value = 14; vib.connect(vg); vg.connect(o.frequency);
    const mix = c.createGain(); mix.gain.setValueAtTime(0.0001, t);
    mix.gain.linearRampToValueAtTime(0.2, t + 0.07); mix.gain.setValueAtTime(0.2, t + 0.4); mix.gain.linearRampToValueAtTime(0.0001, t + d);
    const f1 = c.createBiquadFilter(), f2 = c.createBiquadFilter(), g1 = c.createGain(), g2 = c.createGain();
    f1.type = f2.type = "bandpass"; f1.Q.value = 5; f2.Q.value = 7; g1.gain.value = 1.0; g2.gain.value = 0.8;
    f1.frequency.setValueAtTime(420, t); f1.frequency.linearRampToValueAtTime(760, t + 0.26); f1.frequency.linearRampToValueAtTime(520, t + d);
    f2.frequency.setValueAtTime(2300, t); f2.frequency.linearRampToValueAtTime(2000, t + 0.22); f2.frequency.linearRampToValueAtTime(1000, t + d);
    o.connect(f1); o.connect(f2); f1.connect(g1); f2.connect(g2); g1.connect(mix); g2.connect(mix); mix.connect(c.destination);
    o.start(t); vib.start(t); o.stop(t + d + 0.05); vib.stop(t + d + 0.05);
  };

  // soft whoosh for transitions, rising or falling
  api.swoosh = up => {
    const c = running(); if (!on || !c) return;
    const t = c.currentTime, len = 0.8, n = c.sampleRate * len, buf = c.createBuffer(1, n, c.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;

    const bp = c.createBiquadFilter(); bp.type = "bandpass"; bp.Q.value = 1.2;
    bp.frequency.setValueAtTime(up ? 300 : 2400, t); bp.frequency.exponentialRampToValueAtTime(up ? 2400 : 300, t + 0.7);
    const g = c.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(0.07, t + 0.15); g.gain.linearRampToValueAtTime(0.0001, t + len);

  };

    const c = running(); if (!on || !c) return;
    [0, 0.09].forEach((dt, i) => {
      const t = c.currentTime + dt, o = c.createOscillator(), g = c.createGain();

      g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(0.04, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.18);

    });
  };

  const music = (() => {
    const STEP = 60 / 100 / 2;
    const chords = [[60, 64, 67], [57, 60, 64], [53, 57, 60], [55, 59, 62]], bass = [36, 33, 29, 31];
    const mel = [[76,0,79,0,76,74,72,0],[72,0,76,0,74,0,72,0],[77,0,76,0,72,0,69,0],[74,0,79,0,77,76,74,0],

        step = 0; next = c.currentTime + 0.06; tick(); timer = setInterval(tick, 100);

      stop(fade = 0.3) { wantMusic = false; kill(fade); }
    };
  })();

  api.set = v => { on = v; store.set("mochi-snd", v ? "1" : "0"); if (!on) music.stop(0.2); else { api.unlock(); music.start(0.4); } };

  };

})();

/* typed speech with animalese blips; returns {finish()} */
function typeSay(el, text, done) {
  clearInterval(el._t);
  if (REDUCE) { el.textContent = text; if (done) done(); return { finish() {} }; }
  let i = 0; el.textContent = "";
  const fin = () => { clearInterval(el._t); el.textContent = text; if (done) { const d = done; done = null; d(); } };
  el._t = setInterval(() => { i++; el.textContent = text.slice(0, i); Snd.blip(text[i - 1]); if (i >= text.length) fin(); }, 55);
  return { finish: fin };
}

/* ---------------- iris transition ---------------- */
const Iris = (() => {
  const el = () => document.getElementById("iris");
  const R0 = () => Math.hypot(innerWidth, innerHeight) / 2 + 24;
  const ease = t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  const tween = (ms, fn) => new Promise(res => {
    const s = performance.now();
    const f = now => { const k = Math.min(1, (now - s) / ms); fn(ease(k)); k < 1 ? requestAnimationFrame(f) : res(); };
    requestAnimationFrame(f);
  });
  const hole = r => { el().style.background = r <= 0.5 ? "#3A231B" : `radial-gradient(circle at 50% 50%, transparent ${r}px, #3A231B ${r + 1}px)`; };
  return {
    async close(ms = 700) {
      const e = el(); if (!e) return; e.className = ""; e.style.opacity = ""; e.style.pointerEvents = "all";
      if (REDUCE) { e.style.background = "#3A231B"; e.style.opacity = 0; await tween(220, k => e.style.opacity = k); return; }
      const r0 = R0(); hole(r0); await tween(ms, k => hole(r0 * (1 - k)));
    },
    async open(ms = 800) {
      const e = el(); if (!e) return; e.className = ""; e.style.pointerEvents = "all";
      const guard = setTimeout(() => { e.className = "off"; e.style.pointerEvents = "none"; }, ms + 1500);
      if (REDUCE) { e.style.background = "#3A231B"; await tween(220, k => e.style.opacity = 1 - k); }
      else { const r0 = R0(); hole(0); await tween(ms, k => hole(r0 * k)); }
      clearTimeout(guard); e.className = "off"; e.style.pointerEvents = "none";
    }
  };
})();
// safety net: never leave the page covered by the black overlay
setTimeout(() => { if (!Transition.isBusy()) { const i = document.getElementById("iris"); if (i && i.className !== "off") { i.className = "off"; i.style.pointerEvents = "none"; } } }, 4500);

const Transition = (() => {
  let busy = false;
  const api = {
    isBusy: () => busy,
    // black-out, run mid(), reveal; music stops at the start and restarts as the reveal begins
    async swap(mid) {
      if (busy) return; busy = true;
      Snd.swoosh(false); Snd.music.stop(0.25);
      await Iris.close(700);
      await mid(); await wait(200);
      Snd.swoosh(true); Snd.music.start(0.5);
      await Iris.open(800);
      busy = false;
    },
    // leave this page toward another file
    async leave(href) {
      if (busy) return; busy = true; store.set("mochi-in", "1");
      Snd.swoosh(false); Snd.music.stop(0.25);
      const bail = setTimeout(async () => { await Iris.open(500); busy = false; }, 3000);
      await Iris.close(650);
      location.href = href;
    },
    // a fresh page that starts black
    async arrive() {
      busy = true;
      try { await wait(REDUCE ? 50 : 180); Snd.swoosh(true); Snd.music.start(0.5); } catch (e) {}
      try { await Iris.open(800); } finally { busy = false; }
    }
  };
  document.addEventListener("click", e => {
    const a = e.target.closest && e.target.closest("a[href]");
    if (!a || e.defaultPrevented || e.button || e.metaKey || e.ctrlKey || e.shiftKey) return;
    const href = a.getAttribute("href");
    if (!href || !/\.html$/.test(href)) return;
    e.preventDefault(); api.leave(href);
  });
  return api;
})();

const MEOWS = ["meow.", "mrrp?", "mew.", "prrrr.", "...meow.", "yes, hello. meow."];
function wireMochi(el, onSay) {
  const go = () => {
    Snd.meow();
    el.classList.remove("hop"); void el.offsetWidth; el.classList.add("hop");
    setTimeout(() => el.classList.remove("hop"), 900);
    if (onSay) onSay(MEOWS[Math.floor(Math.random() * MEOWS.length)]);
  };
  el.addEventListener("click", e => { e.stopPropagation(); go(); });
  el.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); go(); } });
}

  }
  bubble.addEventListener("click", advance);
  bubble.addEventListener("keydown", e => { if (mode === "outside" && (e.key === "Enter" || e.key === " ") && e.target === bubble) { e.preventDefault(); advance(); } });

  if (mode === "outside") {
    bubble.tabIndex = 0; bubble.setAttribute("role", "button");
    startIntro();
  } else {
    sayEl.textContent = "";
    Transition.arrive().then(() => say("welcome back. the couch missed you."));
  }
})();

(function () {
  const key = document.body.dataset.room;
  const room = ROOMS.find(r => r.key === key);
  const accents = { living: "#F6C0A3", kitchen: "#FFD8A8", bed: "#E4D8CB", bath: "#B9D4F0", vanity: "#F2A67A", office: "#E2D4C6", closet: "#F3C7A9" };
  const acc = accents[key];
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const intro = {
    living: "this is where i lie down. everything here has been tested by lying on it.",
    kitchen: "snacks happen here. the stove is mostly decoration.",
    bath: "good lighting for thinking about nothing in particular.",
    bed: "sleep is the only hobby i have committed to.",
    closet: "outfits start here. hats are mandatory.",
    office: "i sit here and look busy. it is going well.",
    vanity: "you found my favorite room!"
  }[key];
  const badges = { tried: "casey tried it", top: "top rated" };

  document.title = `Mochi's ${room.label}`;
  document.getElementById("hero").innerHTML =
    `<div><h1>${esc(room.label)}</h1><p class="say" id="say"></p></div>` +
    `<div class="heromochi" id="heromochi" role="button" tabindex="0" aria-label="Pet Mochi">${mochiHTML(key)}</div>`;
  wireMochi(document.getElementById("heromochi"), t => { typeSay(document.getElementById("say"), t); });
  Snd.bind(document.getElementById("snd"));
  document.getElementById("rooms").innerHTML = ROOMS.map(r =>
    `<a class="rbtn" data-room="${r.key}" href="${r.page}"${r.key === key ? ' aria-current="page"' : ""}>${HEART_SVG}${r.label}</a>`).join("");
  document.getElementById("disc").textContent = DISCLOSURE;

  document.getElementById("rscene").innerHTML = MochiArt.W(key).replace('viewBox="0 0 420 300"', 'viewBox="0 34 420 216"');
  const mine = PRODUCTS.filter(p => p.room === key);
  const sel = document.getElementById("cat");
  const cats = [...new Set(mine.map(p => p.cat))].sort();
  sel.innerHTML = '<option value="">everything</option>' + cats.map(c => `<option value="${esc(c)}">${esc(c)} (${mine.filter(p => p.cat === c).length})</option>`).join("");
  function render() {
    const v = sel.value;
    document.getElementById("grid").innerHTML = mine.filter(p => !v || p.cat === v).map(card).join("");
    document.getElementById("count").textContent = (v ? mine.filter(p => p.cat === v).length : mine.length) + " picks";
  }
  function card(p) {
    const chips = "";
    const live = p.url && p.url !== "#";
    return `<li class="card" id="${p.id}"><span class="cardbow">${BOW_SVG}</span>
      <div class="tile">${p.img ? `<img src="${esc(p.img)}" alt="" loading="lazy" onerror="this.replaceWith(Object.assign(document.createElement('span'),{innerHTML:this.dataset.fb}).firstChild)" data-fb="${esc(iconSVG(p.icon, acc))}">` : iconSVG(p.icon, acc)}</div>
      ${chips ? `<div class="chips">${chips}</div>` : ""}
      <h2>${esc(p.name)}</h2>
      <p>${esc(p.desc)}</p>
      <a class="buy" href="${esc(p.url)}"${live ? ' target="_blank" rel="sponsored noopener noreferrer"' : ""}>see it on amazon</a>
    </li>`;
  }
  sel.addEventListener("change", render);
  render();

  const el = document.getElementById("say");
  Transition.arrive().then(() => typeSay(el, intro));
})();

</script>
