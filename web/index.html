<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mochi rig preview</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="stage">
  <div class="speech-bubble" id="bubble">
    <span id="bubble-text"></span>
    <span class="bubble-tail-fill-1"></span>
    <span class="bubble-tail-fill-2"></span>
  </div>

  <div class="mochi" id="mochi">
    <img src="../assets/mochi-base.svg" alt="Mochi">

    <!-- emotion props: hidden until mochi.js adds "show" -->
    <div class="prop" data-prop="heart">
      <svg viewBox="0 0 9 8"><path d="M2 0H4V1H2z M5 0H7V1H5z M1 1H2V2H1z M4 1H5V2H4z M7 1H8V2H7z M0 2H1V3H0z M8 2H9V3H8z M0 3H9V4H0z M1 4H8V5H1z M2 5H7V6H2z M3 6H6V7H3z M4 7H5V8H4z" fill="#c42828"/></svg>
    </div>

    <div class="prop" data-prop="music">
      <svg viewBox="0 0 10 14"><path d="M6 0H7V9H6z M7 1H9V2H7z M9 2H10V3H9z M3 9H7V10H3z M2 10H4V13H2z M0 11H2V13H0z M0 13H4V14H0z" fill="#3a2c28"/></svg>
    </div>

    <div class="prop" data-prop="sweat">
      <svg viewBox="0 0 6 9"><path d="M2 0H4V1H2z M1 1H5V2H1z M1 2H5V4H1z M0 4H6V6H0z M0 6H6V7H0z M1 7H5V8H1z M2 8H4V9H2z" fill="#7ec8e3"/></svg>
    </div>

    <div class="prop" data-prop="angry">
      <svg viewBox="0 0 9 9"><path d="M4 0H5V4H4z M4 5H5V9H4z M0 4H4V5H0z M5 4H9V5H5z" stroke="#c42828" stroke-width="1.4" fill="none"/></svg>
    </div>

    <div class="prop" data-prop="sparkle">
      <svg viewBox="0 0 9 9"><path d="M4 0H5V3H4z M4 6H5V9H4z M0 4H3V5H0z M6 4H9V5H6z M2 2H3V3H2z M6 6H7V7H6z M6 2H7V3H6z M2 6H3V7H2z" fill="#ffd54a"/></svg>
    </div>
  </div>
</div>

<div class="controls">
  <button data-action="say">Say something</button>
  <button data-action="prop" data-prop="heart">Heart</button>
  <button data-action="prop" data-prop="music">Music note</button>
  <button data-action="prop" data-prop="sweat">Sweat drop</button>
  <button data-action="prop" data-prop="angry">Angry</button>
  <button data-action="prop" data-prop="sparkle">Sparkle</button>
  <button data-action="clear">Clear props</button>
</div>

<script src="mochi.js"></script>
</body>
</html>
